name: Polyglot adapter contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_polyglot*.py' -v
      - run: python -m pip wheel --no-deps . --wheel-dir dist-polyglot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polyglot-python-wheel
          path: dist-polyglot/*.whl
          if-no-files-found: error
