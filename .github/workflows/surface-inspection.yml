name: Surface inspection interoperability
on:
  push:
    branches: [feat/surface-inspection-interop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surface-inspection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cse
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/Curved-Surface-Geodesic-Sensitivity-Runtime
          ref: bbc535af29c30997e56fd120320c570830676462
          path: csg
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retain exact source snapshots
        run: |
          mkdir -p evidence
          git -C cse archive --format=tar.gz HEAD > evidence/cse-source.tar.gz
          git -C csg archive --format=tar.gz HEAD > evidence/csg-source.tar.gz
          git -C cse rev-parse HEAD > evidence/cse-revision.txt
          git -C csg rev-parse HEAD > evidence/csg-revision.txt
          sha256sum evidence/*.tar.gz > evidence/SHA256SUMS
      - name: Install baseline engines
        run: python -m pip install ./cse './csg[dev]' 'numpy==2.4.3' 'pytest==9.0.2'
      - name: CSE baseline suite
        working-directory: cse
        run: python -m unittest discover -q 2>&1 | tee ../evidence/cse-tests.txt
      - name: CSG contract baseline
        working-directory: csg
        run: python -m pytest -m 'not numerical' --junitxml ../evidence/csg-tests.xml 2>&1 | tee ../evidence/csg-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inspection-qualification
          path: evidence
          if-no-files-found: error
          retention-days: 14
