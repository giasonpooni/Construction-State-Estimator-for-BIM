name: Surface inspection interoperability
on:
  push:
    branches: [feat/surface-inspection-interop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surface-inspection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CSE_REQUIRE_INSPECTION_PROVIDER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cse
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: giasonpooni/Curved-Surface-Runtime
          ref: 6e9afd18ce01130ea3c00f0fe7368d23d40fd269
          path: csg
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retain source identities
        run: |
          mkdir -p evidence
          git -C cse rev-parse HEAD > evidence/cse-revision.txt
          git -C csg rev-parse HEAD > evidence/csg-revision.txt
      - name: Isolated installed-wheel interoperability gate
        run: python cse/integrations/surface_inspection/qualify.py --cse cse --csg csg --output evidence/installed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inspection-installed
          path: evidence/installed
          if-no-files-found: error
          retention-days: 14
      - name: Install source-test dependencies
        run: python -m pip install ./cse './csg[dev]' 'numpy==2.4.3' 'pytest==9.0.2'
      - name: CSE complete baseline and extension suite
        working-directory: cse
        run: python -m unittest discover -q 2>&1 | tee ../evidence/cse-tests.txt
      - name: CSG lint and contract suite
        working-directory: csg
        run: |
          ruff check .
          python -m pytest -m 'not numerical' --junitxml ../evidence/csg-tests.xml 2>&1 | tee ../evidence/csg-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inspection-qualification
          path: evidence
          if-no-files-found: error
          retention-days: 14
