[package]
name = "gat-sp1-kernel"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[[bin]]
name = "gat-sp1-kernel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gat-sp1-kernel-lib = { path = "../lib" }
sp1-sdk = { version = "=6.5.0", features = ["blocking"] }

[build-dependencies]
sp1-build = { version = "=6.5.0" }
